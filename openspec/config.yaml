schema: spec-driven

context: |
  这是基于 OpenMausBot 进行二次开发的工作区。
  按 AGENTS.md 分步读取；查询只看交接顶部，首次实施再核对本版提案、授权与相关任务、规范和差异。
  面向维护者的提案、设计、规范正文、需求和场景名称、任务、交接与审计说明统一用简体中文。
  命令、路径、标识符及 OpenSpec 解析所需的结构标记保留原文。
rules:
  proposal:
    - 写明版本、范围、涉及路径、验收与恢复方式，小改可用短提案。
  specs:
    - 为每项新能力在 Purpose 段落用中文写明用途，使归档生成的正式规范能通过严格校验。
  tasks:
    - 实施前在交接记录中核对当前提案版本和维护者的授权出处。
    - 列出可观察的验证结果，并为维护者的最终审计准备交接记录。
